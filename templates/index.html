<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анализ загруженности парковки ТЦ</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; padding: 40px; }
        .container { max-width: 900px; width: 100%; background: white; border-radius: 16px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { color: #1a1a2e; border-bottom: 3px solid #4a90d9; padding-bottom: 10px; }
        .upload-area { border: 2px dashed #ccc; border-radius: 12px; padding: 30px; text-align: center; margin: 20px 0; transition: 0.3s; }
        .upload-area:hover { border-color: #4a90d9; background: #f8faff; }
        input[type="file"] { margin: 10px 0; }
        .btn { background: #4a90d9; color: white; border: none; padding: 12px 30px; border-radius: 8px; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: #357abd; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
        .result-box { background: #f8f9fa; border-radius: 12px; padding: 15px; text-align: center; }
        .result-box img { max-width: 100%; border-radius: 8px; max-height: 400px; }
        .stats { font-size: 24px; font-weight: bold; color: #1a1a2e; }
        .stats span { color: #4a90d9; }
        .history-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        .history-table th, .history-table td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
        .history-table th { background: #4a90d9; color: white; }
        .history-table tr:nth-child(even) { background: #f8f9fa; }
        .history-table img { max-width: 80px; border-radius: 4px; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
    </style>
</head>
<body>
<div class="container">
    <h1>🚗 Анализ загруженности парковки ТЦ</h1>
    <p>Загрузите фото парковки — система определит количество автомобилей</p>

    <div class="upload-area">
        <input type="file" id="imageInput" accept="image/*">
        <br><br>
        <div class="btn-group">
            <button class="btn" onclick="processImage()">🔍 Запустить обработку</button>
            <button class="btn btn-secondary" onclick="loadHistory()">📜 История</button>
            <button class="btn btn-secondary" onclick="downloadReport()">📄 Скачать отчёт PDF</button>
        </div>
    </div>

    <div id="resultContainer" style="display:none;">
        <div class="result-grid">
            <div class="result-box">
                <h3>Обработанное изображение</h3>
                <img id="resultImage" src="" alt="Результат">
            </div>
            <div class="result-box">
                <h3>Статистика</h3>
                <div class="stats">🚗 <span id="vehicleCount">0</span> автомобилей</div>
                <div id="vehicleDetails" style="text-align:left; margin-top:10px; font-size:14px;"></div>
            </div>
        </div>
    </div>

    <div id="historyContainer" style="display:none; margin-top:20px;">
        <h3>📋 История запросов</h3>
        <div style="overflow-x:auto;">
            <table class="history-table" id="historyTable">
                <thead><tr><th>Время</th><th>Файл</th><th>Авто</th><th>Результат</th></tr></thead>
                <tbody id="historyBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    async function processImage() {
        const fileInput = document.getElementById('imageInput');
        const file = fileInput.files[0];
        if (!file) { alert('Выберите изображение'); return; }

        const formData = new FormData();
        formData.append('image', file);

        const response = await fetch('/process', { method: 'POST', body: formData });
        const data = await response.json();

        if (data.error) { alert(data.error); return; }

        document.getElementById('resultContainer').style.display = 'block';
        document.getElementById('resultImage').src = data.image_url + '?' + Date.now();
        document.getElementById('vehicleCount').textContent = data.count;

        const details = data.vehicles.map(v =>
            `${v.class} (${(v.confidence * 100).toFixed(0)}%)`
        ).join('<br>') || 'Нет автомобилей';
        document.getElementById('vehicleDetails').innerHTML = details;

        loadHistory();
    }

    async function loadHistory() {
        const response = await fetch('/history');
        const history = await response.json();
        const tbody = document.getElementById('historyBody');
        tbody.innerHTML = '';

        if (history.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4">История пуста</td></tr>';
        } else {
            history.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${new Date(item.timestamp).toLocaleString()}</td>
                    <td>${item.filename || '—'}</td>
                    <td>${item.count}</td>
                    <td>${item.image_url ? `<img src="${item.image_url}" alt="результат">` : '—'}</td>
                `;
                tbody.appendChild(tr);
            });
        }
        document.getElementById('historyContainer').style.display = 'block';
    }

    function downloadReport() {
        window.location.href = '/report';
    }

    loadHistory();
</script>
</body>
</html>
